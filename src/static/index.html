<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atividades da Mergington High School</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Atividades Extracurriculares</h2>
      <div class="auth-controls">
        <span id="auth-status">Modo visitante</span>
        <button id="login-button" type="button">Login do professor</button>
        <button id="logout-button" class="hidden" type="button">Sair</button>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Atividades Disponíveis</h3>
        <div id="activities-list">
          <!-- As atividades serão carregadas aqui -->
          <p>Carregando atividades...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Inscreva-se em uma Atividade</h3>
        <p id="teacher-required" class="info">Faça login como professor para gerenciar inscrições.</p>
        <form id="signup-form" class="hidden">
          <div class="form-group">
            <label for="email">E-mail do estudante:</label>
            <input type="email" id="email" required placeholder="seu-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Selecione a atividade:</label>
            <select id="activity" required>
              <option value="">-- Selecione uma atividade --</option>
              <!-- As opções de atividade serão carregadas aqui -->
            </select>
          </div>
          <button type="submit">Inscrever-se</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <dialog id="login-dialog">
      <form id="login-form" method="dialog">
        <h3>Login do professor</h3>
        <div class="form-group">
          <label for="username">Usuário:</label>
          <input type="text" id="username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Senha:</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <div class="dialog-actions">
          <button type="submit">Entrar</button>
          <button id="cancel-login" type="button">Cancelar</button>
        </div>
      </form>
    </dialog>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
